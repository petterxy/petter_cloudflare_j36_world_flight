<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>歼-36 · 环球飞行</title>
<style>
:root{--gold:#e8c476;--ink:#05070c}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--ink);overflow:hidden;
 font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;color:#e8e6e0}
#stage{position:fixed;inset:0}
video{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer}
/* 电影黑边 */
.bar{position:fixed;left:0;right:0;height:4.5vh;background:#000;z-index:5;pointer-events:none}
.bar.top{top:0}.bar.bot{bottom:0}
/* 暗角 */
#vig{position:fixed;inset:0;z-index:4;pointer-events:none;
 background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.5) 100%)}
/* 顶部标题 */
#hd{position:fixed;top:6vh;left:3vw;z-index:10;pointer-events:none;
 text-shadow:0 2px 12px rgba(0,0,0,.8)}
#hd h1{font-size:clamp(18px,2.6vw,30px);font-weight:600;letter-spacing:.12em}
#hd h1 em{font-style:normal;color:var(--gold)}
#hd p{font-size:clamp(11px,1.2vw,14px);opacity:.75;margin-top:.4em;letter-spacing:.2em}
/* 机组头像 */
#crew{position:fixed;top:6vh;right:3vw;z-index:10;display:flex;gap:14px}
.member{display:flex;flex-direction:column;align-items:center;gap:5px}
.member img{width:clamp(44px,5vw,64px);height:clamp(44px,5vw,64px);border-radius:50%;
 border:2px solid rgba(232,196,118,.7);box-shadow:0 2px 14px rgba(0,0,0,.6)}
.member span{font-size:11px;letter-spacing:.15em;opacity:.85;text-shadow:0 1px 6px #000}
/* 片头字幕 */
#intro{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;
 align-items:center;justify-content:center;pointer-events:none;
 background:radial-gradient(ellipse at center,rgba(0,0,0,.25),rgba(0,0,0,.65));
 transition:opacity 1.6s ease;text-align:center}
#intro.hide{opacity:0}
#intro h2{font-size:clamp(26px,5vw,54px);font-weight:600;letter-spacing:.3em;
 color:#f5f0e6;text-shadow:0 0 30px rgba(232,196,118,.4)}
#intro p{margin-top:1.2em;font-size:clamp(12px,1.6vw,17px);letter-spacing:.4em;color:var(--gold)}
#intro small{margin-top:2.4em;font-size:11px;opacity:.5;letter-spacing:.2em}
/* 底部控制条 */
#ctl{position:fixed;left:0;right:0;bottom:4.5vh;z-index:10;
 padding:10px 3vw 14px;background:linear-gradient(transparent,rgba(0,0,0,.75));
 display:flex;flex-direction:column;gap:8px}
#prog{height:3px;background:rgba(255,255,255,.18);border-radius:2px;cursor:pointer;position:relative}
#prog .fill{height:100%;width:0;background:var(--gold);border-radius:2px}
#row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chap{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);color:#cfcabf;
 padding:5px 13px;border-radius:20px;font-size:12.5px;cursor:pointer;letter-spacing:.08em;
 transition:all .25s}
.chap:hover{background:rgba(232,196,118,.15)}
.chap.on{background:rgba(232,196,118,.22);border-color:var(--gold);color:var(--gold)}
#spacer{flex:1}
#time{font-size:12px;opacity:.7;font-variant-numeric:tabular-nums}
.ibtn{background:none;border:1px solid rgba(255,255,255,.25);color:#e8e6e0;width:34px;height:34px;
 border-radius:50%;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
.ibtn:hover{border-color:var(--gold);color:var(--gold)}
a.ibtn{text-decoration:none}
#note{position:fixed;bottom:.8vh;left:3vw;z-index:10;font-size:10.5px;opacity:.45;letter-spacing:.05em}
#err{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;
 background:var(--ink);color:#cfcabf;font-size:15px;text-align:center;padding:20px;line-height:2}
@media (max-width:640px){
 #crew{top:auto;bottom:16vh;right:3vw}
 .member span{display:none}
 .chap{padding:4px 9px;font-size:11px}
}
</style>
</head>

 timeEl=document.getElementById('time'),pp=document.getElementById('pp'),
